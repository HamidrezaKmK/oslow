defaults:
  - data: default
  - model: affine_specified
  - hydra: default
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  - _self_

flow_optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0005
  _partial_: true

flow_batch_size: 128

permutation_batch_size: 64
perm_expectation_b_size: 16

rounds: 10


flow_lr_scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  _partial_: true

device: cuda

reinforce_baseline: zero

restart_flow: true

flow_learning_epochs: 250
perm_learning_epochs: 25

perm_optimizer:
  _target_: torch.optim.AdamW
  lr: 0.01
  _partial_: true

perm_lr_scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  _partial_: true

normalize_scores: true


post_processing_method: null


wandb:
  run_name: plackett_luce_
  project: plackett_luce

test_run: false
out_dir: runs/


seed: 123456
