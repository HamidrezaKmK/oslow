defaults:
  - data: default
  - model: affine_specified
  - hydra: default
  - coeff_scheduling_strategy: dwa
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  - _self_

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  _partial_: true

batch_size: 128
perm_expectation_b_size: 64
max_epochs: 1000


lr_scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  _partial_: true

device: cuda
reinforce_baseline: zero

restart_flow: false

flow_learning_iters: -1
perm_learning_iters: -1

perm_optimizer:
  _target_: torch.optim.Adam
  lr: 0.001
  _partial_: true

perm_lr_scheduler:
  _target_: torch.optim.lr_scheduler.ConstantLR
  _partial_: true

normalize_scores: true

sampling: exponential_race



wandb:
  run_name: plackett_luce_
  project: plackett_luce

test_run: false
out_dir: runs/


seed: 123456
